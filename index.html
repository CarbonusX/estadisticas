<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Estadísticas Deportivas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #111;
      margin: 0;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    header {
      text-align: center;
      padding: 20px;
      background-color: #000;
    }

    header img {
      width: 200px;
    }

    nav {
      background-color: #222;
      display: flex;
      justify-content: center;
      padding: 10px 0;
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropbtn {
      background-color: #ffcc00;
      color: #000;
      padding: 12px 16px;
      font-size: 16px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #333;
      min-width: 200px;
      box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
      z-index: 1;
    }

    .dropdown-content a {
      color: #fff;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
    }

    .dropdown-content a:hover {
      background-color: #444;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    .dropdown:hover .dropbtn {
      background-color: #e6b800;
    }

    main {
      padding: 40px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <img src="logo.png" alt="Logo Estadísticas Deportivas">
  </header>

  <nav>
    <div class="dropdown">
      <button class="dropbtn">Fútbol</button>
      <div class="dropdown-content">
        <a href="#">Fútbol Uruguayo</a>
        <a href="#">Fútbol Argentino</a>
        <a href="#">Fútbol Español</a>
        <a href="#">Fútbol Ingles</a>
        <a href="#">Fútbol Italiano</a>  

      <button class="dropbtn">NBA</button>
